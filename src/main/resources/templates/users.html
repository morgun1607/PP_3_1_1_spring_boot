<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Управление пользователями</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f5f5f5;
        }

        h1 {
            color: #333;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background-color: white;
            margin-top: 20px;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
        }

        th {
            background-color: #333;
            color: white;
        }

        .button {
            display: inline-block;
            padding: 8px 14px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .edit {
            background-color: #28a745;
        }

        .delete {
            background-color: #dc3545;
        }

        .actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .actions form {
            margin: 0;
        }
    </style>
</head>

<body>

<h1>Список пользователей</h1>

<a class="button" th:href="@{/users/new}">
    Добавить пользователя
</a>

<table>
    <thead>
    <tr>
        <th>ID</th>
        <th>Имя</th>
        <th>Фамилия</th>
        <th>Email</th>
        <th>Действия</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="user : ${users}">
        <td th:text="${user.id}"></td>
        <td th:text="${user.name}"></td>
        <td th:text="${user.lastName}"></td>
        <td th:text="${user.email}"></td>

        <td>
            <div class="actions">

                <a class="button edit"
                   th:href="@{/users/edit(id=${user.id})}">
                    Изменить
                </a>

                <form th:action="@{/users/delete}"
                      method="post">

                    <input type="hidden"
                           name="id"
                           th:value="${user.id}">

                    <button type="submit"
                            class="button delete"
                            onclick="return confirm('Удалить пользователя?')">
                        Удалить
                    </button>

                </form>

            </div>
        </td>
    </tr>
    </tbody>
</table>

<p th:if="${#lists.isEmpty(users)}">
    Пользователей пока нет.
</p>

</body>
</html>
